name: Order Sync Scheduler

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping-order-sync:
    name: Ping Order Sync Cron
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Sync Webhook
        run: |
          curl --retry 3 --retry-delay 10 --retry-all-errors --fail-with-body -sS -m 30 -X GET "https://app.zicabella.com/api/cron/sync-pending-orders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
