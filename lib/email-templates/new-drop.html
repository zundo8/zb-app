<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zica Bella — {{collectionName}}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap');
    @font-face {
      font-family: 'Rocaston';
      src: url('https://cdn.shopify.com/s/files/1/0955/5394/5881/files/Rocaston.ttf?v=1758543424') format('truetype');
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:0; background:#000; font-family:'DM Mono','Courier New',monospace; }
    @media only screen and (max-width:600px) {
      .container { width:100% !important; border-radius:0 !important; }
      .pad { padding:36px 22px !important; }
      .hero-txt { font-size:44px !important; }
      .prod-cell { display:block !important; width:100% !important; }
    }
  </style>
</head>
<body>
<div style="display:none; max-height:0; overflow:hidden; font-size:0; opacity:0;">{{collectionName}} — New arrivals now available at Zica Bella.</div>
<table border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#000000" style="background:#000000; padding:48px 20px;">
  <tr><td align="center">
    <table border="0" cellpadding="0" cellspacing="0" width="580" class="container" bgcolor="#0a0a0a" style="background:#0a0a0a; border-radius:2px; border:1px solid rgba(255,255,255,0.12);">

      <tr><td bgcolor="#e5e5e5" style="height:3px; background:#e5e5e5; border-radius:2px 2px 0 0; font-size:0; line-height:0;">&nbsp;</td></tr>

      <tr><td class="pad" style="padding:36px 48px 28px;">
        <table border="0" cellpadding="0" cellspacing="0" width="100%"><tr>
          <td style="color:#ffffff; font-family:'Rocaston',serif; font-size:11px; letter-spacing:8px; text-transform:uppercase;">ZICA BELLA</td>
          <td align="right" style="color:rgba(255,255,255,0.6); font-family:'DM Mono','Courier New',monospace; font-size:9px; letter-spacing:2px; text-transform:uppercase;">New Drop</td>
        </tr></table>
      </td></tr>

      <tr><td style="padding:0 48px;"><table border="0" cellpadding="0" cellspacing="0" width="100%"><tr><td bgcolor="#1a1a1a" style="height:1px; font-size:0; line-height:0;">&nbsp;</td></tr></table></td></tr>

      <tr><td class="pad" style="padding:52px 48px 0; color:#ffffff; font-family:'DM Serif Display',Georgia,serif; font-size:52px; font-weight:400; line-height:1.1; letter-spacing:-1px;">
        {{collectionName}}<br>
        <span style="font-style:italic; color:rgba(255,255,255,0.35); font-size:36px;">{{collectionEditorialLine}}</span>
      </td></tr>

      <tr><td class="pad" style="padding:32px 48px 0;">
        {{productsGrid}}
      </td></tr>

      <tr><td class="pad" style="padding:36px 48px 0;">
        <a href="{{collectionUrl}}" style="display:inline-block; background:#ffffff; color:#000000; text-decoration:none; padding:15px 36px; font-family:'DM Mono','Courier New',monospace; font-size:10px; font-weight:400; letter-spacing:2.5px; text-transform:uppercase; border-radius:1px;">View Full Collection →</a>
      </td></tr>

      <tr><td style="padding:36px 48px;"><table border="0" cellpadding="0" cellspacing="0" width="100%"><tr><td bgcolor="#111111" style="height:1px; font-size:0; line-height:0;">&nbsp;</td></tr></table></td></tr>

      <tr><td class="pad" style="padding:0 48px 36px;">
        <table border="0" cellpadding="0" cellspacing="0" width="100%"><tr>
          <td style="color:rgba(255,255,255,0.2); font-family:'Rocaston',serif; font-size:9px; letter-spacing:5px; text-transform:uppercase;">ZICA BELLA</td>
          <td align="right" style="color:rgba(255,255,255,0.18); font-family:'DM Mono','Courier New',monospace; font-size:9px;">India</td>
        </tr></table>
        <p style="margin:16px 0 0; font-family:'DM Mono','Courier New',monospace; font-size:9px; color:rgba(255,255,255,0.12); line-height:1.7;">Sent to {{customerEmail}} · Notification from Zica Bella.</p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
